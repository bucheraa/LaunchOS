version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: launchos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: launchos
      POSTGRES_PASSWORD: launchos_dev
      POSTGRES_DB: launchos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: launchos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
